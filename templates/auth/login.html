{% extends "base.html" %}
{% block title %}登录 · Python 算法练习场{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="brand-mark mx-auto mb-3" style="width:44px;height:44px;font-size:18px;">Py</div>
      <h1 class="h4 fw-bold mb-1">欢迎回来</h1>
      <div class="muted tiny">登录后继续你的刷题进度</div>
    </div>
    <form method="post" novalidate>
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">
      <div class="mb-3">
        <label class="form-label" for="username">账号</label>
        <input class="form-control" id="username" name="username" value="{{ username }}" autocomplete="username" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">密码</label>
        <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="remember" id="remember" checked>
          <label class="form-check-label tiny" for="remember">记住我</label>
        </div>
        <span class="tiny muted">仅限本机使用</span>
      </div>
      <button class="btn btn-primary w-100 py-2 rounded-3" type="submit">登录</button>
    </form>
    <div class="text-center tiny muted mt-3">
      还没有账号？<a href="{{ url_for('auth.register') }}">立即注册</a>
    </div>
  </div>
</div>
{% endblock %}
